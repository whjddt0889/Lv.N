plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lvn.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lvn.app'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 심사용 APK 는 tools/build_apk.sh 로 서명했다. Android Studio 에서는 자체 키로 서명하세요.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 외부 라이브러리 없음 (Android 프레임워크 + android.car 리플렉션)
    // Pleos SDK 정식 배포 후:
    // implementation 'ai.pleos.playground:Vehicle:2.3.2'
    // implementation 'ai.pleos.playground:NaviHelper:2.0.3'
}
